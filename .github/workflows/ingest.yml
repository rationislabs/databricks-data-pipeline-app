name: Ingest
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Re-fetch from this day (YYYY-MM-DD); empty continues from the cursor
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Skipped until the repository variable DATABRICKS_HOST is set (README: one-time steps).
    if: vars.DATABRICKS_HOST != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: # its secrets; restricted to main in the repo settings
      name: prod
      deployment: false # only Deploy deploys: no deployment record per run
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups
      - run: uv run --no-sync python -m ingest ${SINCE:+--since "$SINCE"}
        env:
          SINCE: ${{ inputs.since }}
          ENERGY_CATALOG: ${{ vars.ENERGY_CATALOG }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
