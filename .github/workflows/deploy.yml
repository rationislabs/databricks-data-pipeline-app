name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run: only a successful CI run for a push to this repo's main, never fork code.
    # workflow_dispatch: from main only, so a feature branch never deploys with the secrets.
    if: >-
      vars.DATABRICKS_HOST != '' && ((github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: prod # its secrets; restricted to main in the repo settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
      - run: |
          for v in DATABRICKS_TOKEN DATABRICKS_CLIENT_ID DATABRICKS_CLIENT_SECRET; do
            [ -n "${!v}" ] || unset "$v"   # unset secrets arrive as empty strings
          done
          # The app reads its catalog from app/app.yaml: the same value as the bundle's.
          [[ "${ENERGY_CATALOG:-workspace}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "bad ENERGY_CATALOG"; exit 1; }
          sed -i "s/^\(    value: \)workspace\b.*$/\1${ENERGY_CATALOG:-workspace}/" app/app.yaml
          grep -q "value: ${ENERGY_CATALOG:-workspace}$" app/app.yaml
          databricks bundle deploy --var="catalog=${ENERGY_CATALOG:-workspace}"
        env:
          DATABRICKS_BUNDLE_ENGINE: direct # as `inv deploy`: one engine, one deployment state
          ENERGY_CATALOG: ${{ vars.ENERGY_CATALOG }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
