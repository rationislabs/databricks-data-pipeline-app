version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # only reach the app through gradio, which caps them; `uv lock --upgrade` moves them when it allows
      - dependency-name: safehttpx
      - dependency-name: tomlkit
    groups:
      python:
        patterns: ["*"]
